<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><g font-family="PingFang SC,Heiti SC,Arial Unicode MS,sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#F6F8FC"/><rect x="64" y="64" width="190" height="42" rx="21" fill="#6D4AE0"/><text x="84" y="93" font-size="22" fill="#FFFFFF">操作示意  05 / 05</text><text x="64" y="186" font-size="52" fill="#1B2233">网页授权后，CLI 还要验收</text><text x="66" y="249" font-size="29" fill="#5B6578">授权成功不等于命令行可用</text><rect x="64" y="330" width="412" height="320" rx="24" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/><rect x="64" y="356" width="6" height="268" rx="3" fill="#12A8B8"/><text x="90" y="387" font-size="30" fill="#1B2233">① 专用环境授权</text><text x="90" y="445" font-size="27" fill="#5B6578">在固定网络环境登录</text><text x="90" y="487" font-size="27" fill="#5B6578">避免换出口重复授权</text><rect x="90" y="560" width="52" height="52" rx="16" fill="#E6F6F8"/><text x="105" y="599" font-size="30" fill="#12A8B8">1</text><text x="158" y="596" font-size="23" fill="#5B6578">分别检查 · 保留证据</text><rect x="494" y="330" width="412" height="320" rx="24" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/><rect x="494" y="356" width="6" height="268" rx="3" fill="#6D4AE0"/><text x="520" y="387" font-size="30" fill="#1B2233">② 检查覆盖项</text><text x="520" y="445" font-size="27" fill="#5B6578">检查 PATH 是否指向正确</text><text x="520" y="487" font-size="27" fill="#5B6578">排查 provider 覆盖设置</text><rect x="520" y="560" width="52" height="52" rx="16" fill="#E6F6F8"/><text x="535" y="599" font-size="30" fill="#12A8B8">2</text><text x="588" y="596" font-size="23" fill="#5B6578">分别检查 · 保留证据</text><rect x="924" y="330" width="412" height="320" rx="24" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/><rect x="924" y="356" width="6" height="268" rx="3" fill="#12A8B8"/><text x="950" y="387" font-size="30" fill="#1B2233">③ 重开并请求</text><text x="950" y="445" font-size="27" fill="#5B6578">重开终端与进程</text><text x="950" y="487" font-size="27" fill="#5B6578">发起一次实际请求</text><rect x="950" y="560" width="52" height="52" rx="16" fill="#E6F6F8"/><text x="965" y="599" font-size="30" fill="#12A8B8">3</text><text x="1018" y="596" font-size="23" fill="#5B6578">分别检查 · 保留证据</text><rect x="64" y="744" width="1272" height="74" rx="18" fill="#E9E6FB"/><text x="88" y="792" font-size="29" fill="#6D4AE0">账号认证通过，且实际调用成功，才算完成</text><text x="66" y="873" font-size="23" fill="#5B6578">原创操作示意 · 具体界面以当前版本为准</text></g></svg>