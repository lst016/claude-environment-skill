<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><g font-family="PingFang SC,Heiti SC,Arial Unicode MS,sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#F6F8FC"/><rect x="64" y="64" width="190" height="42" rx="21" fill="#6D4AE0"/><text x="84" y="93" font-size="22" fill="#FFFFFF">操作示意  04 / 05</text><text x="64" y="186" font-size="52" fill="#1B2233">先选住宅，再核对出口</text><text x="66" y="249" font-size="29" fill="#5B6578">节点选对，出口才可信</text><rect x="64" y="330" width="412" height="320" rx="24" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/><rect x="64" y="356" width="6" height="268" rx="3" fill="#12A8B8"/><text x="90" y="387" font-size="30" fill="#1B2233">① 填写参数</text><text x="90" y="445" font-size="27" fill="#5B6578">填入供应商参数</text><text x="90" y="487" font-size="27" fill="#5B6578">同时配置前置节点</text><rect x="90" y="560" width="52" height="52" rx="16" fill="#E6F6F8"/><text x="105" y="599" font-size="30" fill="#12A8B8">1</text><text x="158" y="596" font-size="23" fill="#5B6578">分别检查 · 保留证据</text><rect x="494" y="330" width="412" height="320" rx="24" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/><rect x="494" y="356" width="6" height="268" rx="3" fill="#6D4AE0"/><text x="520" y="387" font-size="30" fill="#1B2233">② 保存并启用</text><text x="520" y="445" font-size="27" fill="#5B6578">保存住宅节点</text><text x="520" y="487" font-size="27" fill="#5B6578">在列表中选中并连接</text><rect x="520" y="560" width="52" height="52" rx="16" fill="#E6F6F8"/><text x="535" y="599" font-size="30" fill="#12A8B8">2</text><text x="588" y="596" font-size="23" fill="#5B6578">分别检查 · 保留证据</text><rect x="924" y="330" width="412" height="320" rx="24" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/><rect x="924" y="356" width="6" height="268" rx="3" fill="#12A8B8"/><text x="950" y="387" font-size="30" fill="#1B2233">③ Safari 查询</text><text x="950" y="445" font-size="27" fill="#5B6578">用 Safari 查询出口</text><text x="950" y="487" font-size="27" fill="#5B6578">确认是当前住宅出口</text><rect x="950" y="560" width="52" height="52" rx="16" fill="#E6F6F8"/><text x="965" y="599" font-size="30" fill="#12A8B8">3</text><text x="1018" y="596" font-size="23" fill="#5B6578">分别检查 · 保留证据</text><rect x="64" y="744" width="1272" height="74" rx="18" fill="#E9E6FB"/><text x="88" y="792" font-size="29" fill="#6D4AE0">以实际查询结果为准，不能手动搜索预期 IP</text><text x="66" y="873" font-size="23" fill="#5B6578">原创操作示意 · 具体界面以当前版本为准</text></g></svg>